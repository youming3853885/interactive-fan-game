<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>選歌畫面 Mockup v2</title>
<style>
  :root { --cyan:#4ec3ff; --mag:#ff6b9d; --gold:#ffd76b; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body {
    height:100vh; overflow:hidden; color:#fff;
    font-family: system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c2036 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 120%, #241a2e 0%, transparent 60%),
      #0b0b12;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .eq { position:fixed; inset:auto 0 0 0; height:22vh; display:flex; gap:6px; align-items:flex-end;
        justify-content:center; opacity:.16; pointer-events:none; }
  .eq i { width:10px; background:linear-gradient(var(--cyan),var(--mag)); border-radius:4px 4px 0 0;
          animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{height:12%} 50%{height:90%} }

  .top { position:fixed; top:26px; text-align:center; }
  .top .kicker { letter-spacing:.4em; font-size:13px; color:#aeb4d8; }
  .top .idx { margin-top:6px; font-size:14px; color:#8890b8; }

  .stage { display:flex; align-items:center; justify-content:center; gap:min(5vw,70px); }

  /* 側邊鄰片：更清楚（不模糊、亮度高） */
  .side { width:150px; height:150px; border-radius:50%; object-fit:cover;
          filter:brightness(.82); transform:scale(.92); box-shadow:0 10px 40px #000a; flex:0 0 auto;
          border:3px solid #ffffff22; }

  .disc-wrap { position:relative; width:min(46vh,420px); aspect-ratio:1; }
  .disc {
    position:absolute; inset:0; border-radius:50%;
    background: repeating-radial-gradient(circle at 50% 50%, #0d0d0f 0 2px, #17171b 2px 4px);
    box-shadow: 0 0 0 6px #05050799, 0 24px 70px #000c, 0 0 60px #4ec3ff33;
    display:flex; align-items:center; justify-content:center;
    animation: spin 4s linear infinite; animation-play-state: paused;
  }
  .disc.playing { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .disc::after { content:""; position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(135deg,#ffffff22 0%, transparent 30% 70%, #ffffff14 100%); }
  .label { width:56%; height:56%; border-radius:50%; position:relative; z-index:2; object-fit:cover;
    box-shadow: inset 0 0 0 4px #00000055, 0 0 0 2px #ffffff22; }
  .hole { position:absolute; z-index:3; width:16px; height:16px; border-radius:50%;
    background:#0b0b12; box-shadow: inset 0 0 0 2px #ffffff55; }

  /* 唱針 tonearm：pivot 在右上，臂斜壓向唱片；試聽時落下 */
  .tonearm { position:absolute; top:-6%; right:-8%; width:44%; height:60%; z-index:6;
    transform-origin: 100% 0%; transform: rotate(20deg); transition: transform .55s cubic-bezier(.4,1.4,.5,1); }
  .disc-wrap.playing .tonearm { transform: rotate(4deg); }
  .pivot { position:absolute; top:0; right:0; width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #eaeef6, #8b93a6 60%, #4b5162);
    box-shadow:0 4px 12px #000a, inset 0 0 0 2px #ffffff55; }
  .arm { position:absolute; top:14px; right:15px; width:9px; height:82%;
    background: linear-gradient(90deg,#aeb6c8,#e9edf5 45%,#8b93a6);
    border-radius:6px; transform-origin: top center; transform: rotate(34deg);
    box-shadow:0 3px 10px #0008; }
  .head { position:absolute; bottom:-10px; left:-5px; width:22px; height:16px; border-radius:4px;
    background:linear-gradient(#33384a,#1c2030); box-shadow:0 3px 8px #0009; }

  .meta { text-align:center; margin-top:26px; }
  .title { font-size:34px; font-weight:800; letter-spacing:.02em; }
  .sub { margin-top:6px; color:#aeb4d8; font-size:15px; }

  .controls { margin-top:22px; display:flex; gap:14px; align-items:center; justify-content:center; }
  .btn { border:none; cursor:pointer; border-radius:999px; font-weight:700; font-size:16px; padding:12px 22px; }
  .preview { background:#ffffff14; color:#fff; border:1px solid #ffffff2e; }
  .preview:hover { background:#ffffff22; }
  .start { background:linear-gradient(135deg,var(--cyan),var(--mag)); color:#0b0b12; font-size:18px;
    padding:14px 40px; box-shadow:0 8px 30px #ff6b9d55; }
  .start:hover { filter:brightness(1.08); transform:translateY(-1px); }

  .chev { width:64px; height:64px; border-radius:50%; border:1px solid #ffffff33;
    background:#ffffff0d; color:#fff; font-size:30px; cursor:pointer; flex:0 0 auto;
    transition:.15s; backdrop-filter: blur(4px); }
  .chev:hover { background:var(--cyan); color:#0b0b12; transform:scale(1.08); box-shadow:0 0 24px #4ec3ff88; }

  .dots { margin-top:22px; display:flex; gap:10px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:#ffffff33; }
  .dots i.on { background:var(--gold); box-shadow:0 0 12px var(--gold); }
</style>
</head>
<body>
  <div class="eq" id="eq"></div>
  <div class="top">
    <div class="kicker">選 擇 歌 曲</div>
    <div class="idx" id="idx">1 / 4</div>
  </div>

  <div class="stage">
    <button class="chev" onmouseenter="sfxHover()" onclick="move(-1)">‹</button>
    <img class="side" id="sidePrev" alt="">

    <div class="disc-wrap" id="discWrap">
      <div class="disc" id="disc">
        <img class="label" id="label" alt="">
        <div class="hole"></div>
      </div>
      <div class="tonearm">
        <div class="arm"><div class="head"></div></div>
        <div class="pivot"></div>
      </div>
    </div>

    <img class="side" id="sideNext" alt="">
    <button class="chev" onmouseenter="sfxHover()" onclick="move(1)">›</button>
  </div>

  <div class="meta">
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="controls">
    <button class="btn preview" id="prev" onmouseenter="sfxHover()" onclick="togglePreview()">▶ 試聽</button>
    <button class="btn start" onmouseenter="sfxHover()" onclick="sfxConfirm()">開始遊戲</button>
  </div>

  <div class="dots" id="dots"></div>
  <audio id="au"></audio>

<script>
  const songs = [
    { name:'Canon Rock', sub:'搖滾電吉他',
      cover:'../音樂影片/Canon Rock 封面.png', audio:'../public/mv/canon-rock.mp4' },
    { name:'超跑情人夢', sub:'卜學亮',
      cover:'../音樂影片/超跑情人夢.jpg', audio:'../public/mv/super-run.mp4' },
    { name:'大黃蜂的飛行', sub:'古典 · 快板',
      cover:'../音樂影片/大黃蜂的飛行.jpg', audio:'../public/mv/flight-of-bumblebee.mp4' },
    { name:'頭文字D', sub:'INITIAL D · Eurobeat',
      cover:'../音樂影片/頭文字D.jpg', audio:'../public/mv/initial-d.mp4' },
  ];
  let i = 0, playing = false;
  const el = (id)=>document.getElementById(id);
  const au = el('au');

  // ---- 勁舞團式音效（WebAudio 即時合成，免素材）----
  let ac;
  const actx = ()=> (ac = ac || new (window.AudioContext||window.webkitAudioContext)());
  function blip(freq, dur, type='square', vol=0.14){
    const a=actx(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur);
  }
  function sfxMove(d){ blip(d>0?820:640,0.07,'square',0.13); setTimeout(()=>blip(d>0?1240:980,0.06,'square',0.08),38); }
  function sfxHover(){ blip(1250,0.028,'sine',0.05); }
  function sfxToggle(on){ blip(on?760:360,0.09,'sawtooth',0.11); }
  function sfxConfirm(){ [523,659,784,1047].forEach((f,k)=>setTimeout(()=>blip(f,0.12,'triangle',0.14),k*65)); }

  function paint(){
    const s = songs[i];
    el('label').src = s.cover;
    el('title').textContent = s.name;
    el('sub').textContent = s.sub;
    el('idx').textContent = `${i+1} / ${songs.length}`;
    el('sidePrev').src = songs[(i-1+songs.length)%songs.length].cover;
    el('sideNext').src = songs[(i+1)%songs.length].cover;
    el('dots').innerHTML = songs.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
    if (playing) { au.src = s.audio; au.play().catch(()=>{}); } // 切歌時試聽跟著換
  }
  function move(d){ i=(i+d+songs.length)%songs.length; sfxMove(d); paint(); }
  function togglePreview(){
    playing = !playing;
    el('disc').classList.toggle('playing', playing);
    el('discWrap').classList.toggle('playing', playing);
    el('prev').textContent = playing ? '⏸ 停止試聽' : '▶ 試聽';
    sfxToggle(playing);
    if (playing){ au.src = songs[i].audio; au.play().catch(()=>{}); } else au.pause();
  }
  el('eq').innerHTML = Array.from({length:48}).map((_,k)=>`<i style="animation-delay:${(k%12)*0.08}s"></i>`).join('');
  paint();
  addEventListener('keydown', e=>{ if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); });
</script>
</body>
</html>
