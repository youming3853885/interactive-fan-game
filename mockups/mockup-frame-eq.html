<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>外框音波 mockup</title>
<style>
 body{margin:0;background:#0a0b12;color:#e7ecff;font-family:system-ui,sans-serif}
 .wrap{max-width:1000px;margin:0 auto;padding:18px}h1{text-align:center;font-size:20px}
 .sub{text-align:center;color:#8b93bd;font-size:13px;margin-top:-6px}
 .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid #ffffff1a;
   background:radial-gradient(120% 80% at 50% 40%,#241a3a 0,#0c1020 60%,#0a0b16 100%)}
 .mv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 12vw system-ui;color:#ffffff0d}
 /* 點陣音波元件（同 select-screen ss-eq 樣式） */
 .eq{position:absolute;left:0;right:0;height:16%;display:flex;justify-content:space-between;padding:0 2%;pointer-events:none;z-index:2}
 .eq.top{top:0} .eq.bot{bottom:0}
 .eq .col{display:flex;flex-direction:column;justify-content:center;gap:3px;height:100%}
 .eq .col span{width:6px;height:6px;border-radius:50%;background:#173a63}
 .eq .col span.on{background:#5fe0ff;box-shadow:0 0 8px #5fe0ff,0 0 3px #cdefff}
 /* 假遊戲元件 */
 .clock{position:absolute;top:9%;left:50%;transform:translateX(-50%);color:#3fe0ff;font:900 5vw monospace;text-shadow:0 0 12px #3fe0ff88;z-index:3}
 .score{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);color:#2b7bff;font:900 3vw system-ui;z-index:3}
 .arrowc{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:16vw;height:16vw;border:0.9vw dashed #2b7bff88;border-radius:50%;z-index:3}
 .note{color:#c3cbef;font-size:14px;line-height:1.7}
</style></head><body>
<div class="wrap">
 <h1>遊玩畫面外框改用「點陣音波」元件（隨音樂律動）</h1>
 <div class="sub">與選歌畫面同一款點陣音波（暗藍→亮青發光、中央對稱）；取代原本的光暈邊框</div>
 <div class="stage" id="stage">
   <div class="mv">DEJA VU</div>
   <div class="eq top" id="eqTop"></div>
   <div class="eq bot" id="eqBot"></div>
   <div class="clock">01:23</div>
   <div class="arrowc"></div>
   <div class="score">得分：3000 分</div>
 </div>
 <ul class="note">
   <li>上下各一條點陣音波當外框，接遊戲 MV 的聲音（AnalyserNode）→ 隨節奏跳動</li>
   <li>combo 越高時可整體提亮/變色（可選）；不與時鐘/箭頭/能量條重疊（在最上下緣）</li>
   <li>要的話也能四邊都框（左右豎排），這裡先示範上下</li>
 </ul>
</div>
<script>
const NB=52, ROWS=9, rowCenter=(ROWS-1)/2;
function build(el){ el.innerHTML=Array.from({length:NB}).map(()=>`<div class="col">${'<span></span>'.repeat(ROWS)}</div>`).join(''); return [...el.querySelectorAll('.col')].map(c=>[...c.children]); }
const top=build(document.getElementById('eqTop')), bot=build(document.getElementById('eqBot'));
let t=0;
function tick(){ t+=0.08;
 for(let k=0;k<NB;k++){
   // 假頻譜：低頻在兩側、節奏起伏
   const base=0.5+0.5*Math.sin(t*1.3+k*0.35)*Math.sin(t*0.7+k*0.11);
   const v=Math.max(0,Math.min(1,base*(0.5+0.5*Math.sin(t*2))));
   const lit=Math.max(1,Math.round(Math.pow(v,0.7)*ROWS));
   for(let r=0;r<ROWS;r++){ const on=Math.abs(r-rowCenter)<=lit/2; top[k][r].classList.toggle('on',on); bot[k][r].classList.toggle('on',on); }
 }
 requestAnimationFrame(tick);
}
tick();
</script></body></html>
