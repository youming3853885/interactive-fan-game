<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="system-ui,'Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker>
    <style>
      .box{fill:#f7f9fc;stroke:#334;stroke-width:2;rx:10}
      .lbl{font-size:15px;fill:#111;font-weight:700}
      .pin{font-size:12px;fill:#333}
      .note{font-size:12px;fill:#555}
      .w12{stroke:#e23b3b;stroke-width:3;fill:none}   /* 12V 紅 */
      .w5{stroke:#f39c12;stroke-width:3;fill:none}     /* 5V 橘 */
      .wg{stroke:#222;stroke-width:3;fill:none}        /* GND 黑 */
      .ws{stroke:#2b7bff;stroke-width:2.4;fill:none}   /* PWM 訊號 藍 */
      .wd{stroke:#8e44ad;stroke-width:2.6;fill:none}   /* 燈資料 紫 */
      .cap{fill:#fff;stroke:#0a8a5f;stroke-width:2}
      .capT{font-size:11px;fill:#0a8a5f;font-weight:700}
    </style>
  </defs>

  <text x="24" y="34" font-size="21" font-weight="800" fill="#111">畫圈對決 · 接線圖（Arduino Nano ＋ 2×MOSFET 模組 ＋ 2 顆 775 風機 ＋ 2 WS2812）</text>
  <text x="24" y="56" class="note">重點：Nano 走 USB 供電；12V/10A 只給風機＋(降壓後)燈；風機單向吹用 MOSFET 純 PWM 調速（不用 L298N）；全部共地。</text>

  <!-- 電源 12V/10A -->
  <rect x="30" y="86" width="172" height="82" rx="10" class="box"/>
  <text x="45" y="114" class="lbl">電源 12V / 10A</text>
  <text x="45" y="136" class="pin">＋12V</text><circle cx="192" cy="131" r="4" fill="#e23b3b"/>
  <text x="45" y="156" class="pin">GND</text><circle cx="192" cy="151" r="4" fill="#222"/>

  <!-- 降壓 12V->5V -->
  <rect x="30" y="300" width="172" height="92" rx="10" class="box"/>
  <text x="45" y="328" class="lbl">降壓模組 12V→5V</text>
  <text x="45" y="348" class="pin">IN+ / IN−（吃 12V）</text>
  <text x="45" y="368" class="pin">OUT +5V / GND（給燈）</text>
  <circle cx="192" cy="343" r="4" fill="#e23b3b"/><circle cx="30" cy="343" r="4" fill="#222"/>
  <circle cx="192" cy="380" r="4" fill="#f39c12"/><circle cx="30" cy="380" r="4" fill="#222"/>

  <!-- Arduino Nano -->
  <rect x="290" y="86" width="196" height="214" rx="10" class="box"/>
  <text x="310" y="114" class="lbl">Arduino Nano</text>
  <rect x="276" y="118" width="16" height="30" rx="3" fill="#bbb" stroke="#334"/>
  <text x="250" y="110" class="note" transform="rotate(-90 250,180)">USB → 電腦（供電＋Serial）</text>
  <text x="386" y="150" class="pin">D3(PWM~)→風機A</text><circle cx="486" cy="145" r="4" fill="#2b7bff"/>
  <text x="386" y="176" class="pin">D5(PWM~)→風機B</text><circle cx="486" cy="171" r="4" fill="#2b7bff"/>
  <text x="386" y="210" class="pin">D7 → 燈A DIN</text><circle cx="486" cy="205" r="4" fill="#8e44ad"/>
  <text x="386" y="236" class="pin">D8 → 燈B DIN</text><circle cx="486" cy="231" r="4" fill="#8e44ad"/>
  <text x="306" y="288" class="pin">GND</text><circle cx="298" cy="283" r="4" fill="#222"/>

  <!-- MOSFET 模組 A -->
  <rect x="590" y="104" width="196" height="92" rx="10" class="box"/>
  <text x="606" y="128" class="lbl">MOSFET 模組 A（風機1P）</text>
  <text x="606" y="148" class="pin">SIG / GND（訊號側）</text><circle cx="590" cy="143" r="4" fill="#2b7bff"/>
  <text x="606" y="168" class="pin">V+ / V−（12V 進）</text><circle cx="590" cy="163" r="4" fill="#e23b3b"/>
  <text x="606" y="188" class="pin">OUT → 馬達</text><circle cx="786" cy="160" r="4" fill="#e23b3b"/>

  <!-- MOSFET 模組 B -->
  <rect x="590" y="232" width="196" height="92" rx="10" class="box"/>
  <text x="606" y="256" class="lbl">MOSFET 模組 B（風機2P）</text>
  <text x="606" y="276" class="pin">SIG / GND（訊號側）</text><circle cx="590" cy="271" r="4" fill="#2b7bff"/>
  <text x="606" y="296" class="pin">V+ / V−（12V 進）</text><circle cx="590" cy="291" r="4" fill="#e23b3b"/>
  <text x="606" y="316" class="pin">OUT → 馬達</text><circle cx="786" cy="288" r="4" fill="#e23b3b"/>

  <!-- 馬達 A / B (775) -->
  <rect x="920" y="120" width="120" height="70" rx="10" class="box"/>
  <text x="945" y="160" class="lbl">775 風機 A</text>
  <rect x="920" y="250" width="120" height="70" rx="10" class="box"/>
  <text x="945" y="290" class="lbl">775 風機 B</text>
  <!-- 馬達端 續流二極體 SS34 -->
  <rect x="1048" y="138" width="14" height="34" class="cap"/><text x="1066" y="160" class="capT">SS34</text>
  <rect x="1048" y="268" width="14" height="34" class="cap"/><text x="1066" y="290" class="capT">SS34</text>

  <!-- WS2812 -->
  <rect x="560" y="470" width="180" height="82" rx="10" class="box"/>
  <text x="580" y="498" class="lbl">WS2812 燈條 A</text>
  <text x="580" y="520" class="pin">5V / GND / DIN(D7)</text>
  <text x="580" y="538" class="capT">DIN 串 330Ω</text>
  <rect x="800" y="470" width="180" height="82" rx="10" class="box"/>
  <text x="820" y="498" class="lbl">WS2812 燈條 B</text>
  <text x="820" y="520" class="pin">5V / GND / DIN(D8)</text>
  <text x="820" y="538" class="capT">DIN 串 330Ω</text>

  <!-- 大電容 4700uF 跨 12V–GND（電源端） -->
  <rect x="208" y="188" width="24" height="44" rx="4" class="cap"/>
  <text x="132" y="252" class="capT">4700µF/25V</text>
  <text x="150" y="266" class="capT">跨12V–GND</text>

  <!-- ===== 電源線 12V(紅) ===== -->
  <path class="w12" d="M196,131 V70 H560 V271 H590"/>            <!-- PSU12V → 頂部 → 左側匯流 → MOSFET B V+ -->
  <path class="w12" d="M560,143 H590"/>                           <!-- 分支 → MOSFET A V+ -->
  <path class="w12" d="M196,131 V343 H188"/>                      <!-- 分支 → 降壓 IN+ -->
  <path class="w12" d="M196,200 H208"/>                           <!-- 大電容上腳 → 12V -->
  <path class="w12" d="M786,160 H920"/>                          <!-- MOSFET A OUT → 馬達A -->
  <path class="w12" d="M786,288 H920"/>                          <!-- MOSFET B OUT → 馬達B -->

  <!-- ===== 5V(橘) ===== -->
  <path class="w5" d="M196,380 H520 V478 H560"/>                 <!-- 降壓5V → 燈A 5V -->
  <path class="w5" d="M520,478 H800"/>                            <!-- → 燈B 5V -->

  <!-- ===== GND(黑) 共地匯流 ===== -->
  <path class="wg" d="M196,151 H250 V710 H1000"/>               <!-- PSU GND → 底部共地匯流排 -->
  <path class="wg" d="M188,363 V710"/>                            <!-- 降壓 GND -->
  <path class="wg" d="M298,283 V320 H268 V710"/>                <!-- Nano GND -->
  <path class="wg" d="M574,143 V420 H560 V710"/>                <!-- MOSFET A 訊號GND -->
  <path class="wg" d="M574,271 V430 H548 V710"/>                <!-- MOSFET B 訊號GND -->
  <path class="wg" d="M232,210 H250"/>                            <!-- 大電容 下腳 GND -->
  <path class="wg" d="M650,552 V710"/>                            <!-- 燈A GND -->
  <path class="wg" d="M890,552 V710"/>                            <!-- 燈B GND -->
  <text x="1004" y="714" class="note">← 共地 (所有 GND 接在一起)</text>

  <!-- ===== PWM 訊號(藍) Nano→MOSFET ===== -->
  <path class="ws" d="M486,145 H538 V143 H590"/>                <!-- D3 → MOSFET A SIG -->
  <path class="ws" d="M486,171 H520 V271 H590"/>                <!-- D5 → MOSFET B SIG -->

  <!-- ===== 燈資料(紫) ===== -->
  <path class="wd" d="M486,205 H548 V455 H648 V470"/>           <!-- D7 → 燈A DIN -->
  <path class="wd" d="M486,231 H532 V460 H888 V470"/>           <!-- D8 → 燈B DIN -->

  <!-- 圖例 -->
  <rect x="30" y="470" width="480" height="230" rx="10" fill="#fff" stroke="#ccd" stroke-width="1.5"/>
  <text x="46" y="496" class="lbl">圖例 / 線色</text>
  <line x1="46" y1="516" x2="86" y2="516" class="w12"/><text x="94" y="520" class="pin">12V（電源→MOSFET→775 風機）</text>
  <line x1="46" y1="538" x2="86" y2="538" class="w5"/><text x="94" y="542" class="pin">5V（降壓→WS2812）</text>
  <line x1="46" y1="560" x2="86" y2="560" class="wg"/><text x="94" y="564" class="pin">GND 共地（全部接一起）</text>
  <line x1="46" y1="582" x2="86" y2="582" class="ws"/><text x="94" y="586" class="pin">PWM 訊號 Nano D3/D5 → MOSFET SIG</text>
  <line x1="46" y1="604" x2="86" y2="604" class="wd"/><text x="94" y="608" class="pin">燈條資料 D7/D8 → DIN（各串 330Ω）</text>
  <text x="46" y="632" class="capT">綠色＝電容/二極體：12V 端 4700µF/25V ＋ 馬達端 SS34 續流二極體</text>
  <text x="46" y="652" class="note">風機單向吹：韌體把 F/R 都當「轉」、S「停」，MOSFET 純 PWM 調速。</text>
  <text x="46" y="672" class="note">協定：A,F,180,45;B,R,200,60（頻道,方向,PWM,能量）</text>
  <text x="46" y="690" class="note">⚠ Nano 只出 PWM＋GND，不碰 12V；馬達/燈電流不走 Nano 的腳。</text>
</svg>
